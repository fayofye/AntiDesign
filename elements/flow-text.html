<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Element: copy that flows along a data line</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#A39E8E;color:#000000;font-family:'Martian Mono',ui-monospace,monospace}
h1{margin:0;padding:40px 32px 0;font:italic 500 clamp(56px,10vw,136px)/.9 'Bodoni Moda',Didot,serif;letter-spacing:-.02em}
.strip{overflow-x:auto;overflow-y:hidden;scrollbar-color:#000000 transparent}
.strip:focus-visible{outline:3px solid #000000;outline-offset:-3px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px 32px 48px;font-size:13px}
button{font:600 14px 'Martian Mono',ui-monospace,monospace;background:transparent;color:#000000;border:1.5px solid #000000;border-radius:0;padding:12px 18px;min-height:44px;cursor:pointer}
button:hover{background:#000000;color:#A39E8E}
</style>
</head>
<body>
<h1>Read the line.</h1>
<div class="strip" id="strip" tabindex="0" role="region" aria-label="Text written along a line chart. Scroll sideways to read.">
<svg id="flow" height="760" xmlns="http://www.w3.org/2000/svg" style="display:block"></svg>
</div>
<div class="controls">
<button type="button" id="back">← Earlier</button>
<button type="button" id="fwd">Later →</button>
<span>or swipe the line. Sample data.</span>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// Smooth path through the points (Catmull-Rom turned into cubic Béziers).
function smoothPath(pts) {
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}

// Draws values as a line `step` px apart and sets `text` along it, shrinking the type until it fits.
// marks: [{ i, label }] puts a dot and a label on point i.
function flowLine(svg, { values, text, marks = [], step = 420, height = 760, pad = 120, maxFont = 56 }) {
  const max = Math.max(...values), min = Math.min(0, ...values);
  const y = v => height - pad - (v - min) / (max - min || 1) * (height - 2 * pad);
  const pts = values.map((v, i) => [80 + i * step, Math.round(y(v))]);
  const width = 80 * 2 + (values.length - 1) * step;
  svg.setAttribute('width', width);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  el('line', { x1: 0, y1: y(min), x2: width, y2: y(min), stroke: '#000000', 'stroke-width': 1 }, svg);
  const path = el('path', { id: 'flow-path', d: smoothPath(pts), fill: 'none', stroke: '#FFFFFF', 'stroke-width': 4, 'stroke-linecap': 'round' }, svg);
  const t = el('text', { dy: -26, fill: '#000000', 'font-family': "'Bodoni Moda', Didot, serif", 'font-style': 'italic' }, svg);
  const tp = el('textPath', { href: '#flow-path', startOffset: 30 }, t);
  tp.textContent = text;
  let size = maxFont;
  t.setAttribute('font-size', size);
  const room = path.getTotalLength() - 60;
  while (size > 18 && t.getComputedTextLength() > room) t.setAttribute('font-size', --size);
  for (const m of marks) {
    const [x, yy] = pts[m.i];
    el('circle', { cx: x, cy: yy, r: 8, fill: '#000000' }, svg);
    el('text', { x, y: yy + 48, 'text-anchor': 'middle', 'font-family': "'Martian Mono', monospace", 'font-size': 15, 'letter-spacing': 1.5, fill: '#000000' }, svg).textContent = m.label;
  }
}

flowLine(document.getElementById('flow'), {
  values: [20, 34, 30, 18, 44, 52, 38, 61, 70, 66, 88, 95],
  text: 'Every line in a chart is a story, and here the words ride on it. It climbs, slips back, climbs again, dips hard in the middle, recovers, and ends near the top. Swap in the product\'s own numbers and its own sentence.',
  marks: [{ i: 3, label: 'FIRST DIP' }, { i: 6, label: 'SECOND DIP' }, { i: 11, label: 'PEAK' }]
});
const strip = document.getElementById('strip');
document.getElementById('back').onclick = () => strip.scrollBy({ left: -900, behavior: 'smooth' });
document.getElementById('fwd').onclick = () => strip.scrollBy({ left: 900, behavior: 'smooth' });
</script>
</body>
</html>
